name: Next.js preview build
on:
  push:
    branches: [nextjs-redesign-preview]
    paths:
      - "nextjs-preview/**"
      - ".github/workflows/nextjs-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "nextjs-preview/**"
      - ".github/workflows/nextjs-preview.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs-preview/package.json
      - run: npm install
      - run: npm run build
