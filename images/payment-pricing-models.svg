<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Two payment pricing models</title><desc id="desc">Flat-rate vs interchange-plus</desc><rect width="1200" height="460" rx="28" fill="#f4f7fb"/><text x="55" y="75" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#14213d">Two payment pricing models</text><text x="55" y="115" font-family="Arial,sans-serif" font-size="20" fill="#64748b">Flat-rate vs interchange-plus</text><rect x="48" y="205" width="543" height="190" rx="18" fill="#e8f1ff" stroke="#4f79b8" stroke-width="2.5"/><text x="68" y="250" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#4f79b8">FLAT-RATE</text><text x="319.5" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14213d">One blended rate</text><text x="319.5" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Simple to forecast</text><rect x="609" y="205" width="543" height="190" rx="18" fill="#e9f7f2" stroke="#3b8b73" stroke-width="2.5"/><text x="629" y="250" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#3b8b73">INTERCHANGE-PLUS</text><text x="880.5" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14213d">Pass-through + markup</text><text x="880.5" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">More fee visibility</text><path d="M594 300h12m-5 -6 6 6 -6 6" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Stackwire · Conceptual guide</text></svg>