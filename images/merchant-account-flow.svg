<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">How a merchant account fits into a card payment</title><desc id="desc">A simplified card payment flow from customer checkout through authorization, acquiring, merchant account settlement and bank payout.</desc><rect width="1200" height="500" rx="28" fill="#f4f7fb"/><text x="60" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#14213d">From card checkout to a business bank payout</text><text x="60" y="98" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Simplified sequence · exact arrangements vary by provider</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="45" y="155" width="200" height="180" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="145" y="215" font-size="23" font-weight="700" fill="#14213d">Customer</text><text x="145" y="253" font-size="17" fill="#475569">Pays by card</text><text x="145" y="282" font-size="17" fill="#475569">at checkout</text><rect x="285" y="155" width="200" height="180" rx="16" fill="#e8f1ff" stroke="#4f79b8" stroke-width="3"/><text x="385" y="215" font-size="23" font-weight="700" fill="#14213d">Issuer</text><text x="385" y="253" font-size="17" fill="#334155">Checks and</text><text x="385" y="282" font-size="17" fill="#334155">authorizes</text><rect x="525" y="155" width="200" height="180" rx="16" fill="#e9f7f2" stroke="#3b8b73" stroke-width="3"/><text x="625" y="215" font-size="23" font-weight="700" fill="#14213d">Acquirer</text><text x="625" y="253" font-size="17" fill="#334155">Processes and</text><text x="625" y="282" font-size="17" fill="#334155">settles funds</text><rect x="765" y="155" width="200" height="180" rx="16" fill="#fff4e5" stroke="#c28a39" stroke-width="3"/><text x="865" y="215" font-size="23" font-weight="700" fill="#14213d">Merchant</text><text x="865" y="253" font-size="17" fill="#475569">Account</text><text x="865" y="282" font-size="17" fill="#475569">Settlement balance</text><rect x="1005" y="155" width="150" height="180" rx="16" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="1080" y="215" font-size="21" font-weight="700" fill="#14213d">Business</text><text x="1080" y="253" font-size="17" fill="#475569">Bank</text><text x="1080" y="282" font-size="17" fill="#475569">Payout</text><g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M250 245h30m-12 -12 12 12 -12 12"/><path d="M490 245h30m-12 -12 12 12 -12 12"/><path d="M730 245h30m-12 -12 12 12 -12 12"/><path d="M970 245h30m-12 -12 12 12 -12 12"/></g></g><rect x="60" y="385" width="1080" height="65" rx="12" fill="#fff" stroke="#d7e0ea"/><text x="600" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">Authorization happens first · settlement and payout happen afterward</text></svg>