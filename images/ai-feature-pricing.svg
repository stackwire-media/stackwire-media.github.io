<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Build an AI feature price</title><desc id="desc">Start with cost, usage and margin</desc><rect width="1200" height="460" rx="28" fill="#f4f7fb"/><text x="55" y="75" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#14213d">Build an AI feature price</text><text x="55" y="115" font-family="Arial,sans-serif" font-size="20" fill="#64748b">Start with cost, usage and margin</text><rect x="48" y="205" width="356" height="190" rx="18" fill="#e8f1ff" stroke="#4f79b8" stroke-width="2.5"/><text x="68" y="250" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#4f79b8">1 · COST</text><text x="226" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14213d">Model + tools</text><text x="226" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Estimate per task</text><rect x="422" y="205" width="356" height="190" rx="18" fill="#e9f7f2" stroke="#3b8b73" stroke-width="2.5"/><text x="442" y="250" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#3b8b73">2 · USAGE</text><text x="600" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14213d">Tasks per month</text><text x="600" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Model customer mix</text><rect x="796" y="205" width="356" height="190" rx="18" fill="#fff4e5" stroke="#c28a39" stroke-width="2.5"/><text x="816" y="250" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#c28a39">3 · PRICE</text><text x="974" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14213d">Plan and limits</text><text x="974" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475