<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Payment gateway, processor and payment service provider roles</title><desc id="desc">The gateway sits near checkout and securely transmits payment information. The processor routes and processes transaction messages. A payment service provider can bundle these and other services.</desc>
<rect width="1200" height="460" rx="28" fill="#f4f7fb"/><text x="60" y="65" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#14213d">Three terms, different scopes</text>
<g font-family="Arial,sans-serif">
<rect x="55" y="120" width="320" height="245" rx="20" fill="#e8f1ff" stroke="#4f79b8" stroke-width="3"/><text x="215" y="175" font-size="27" font-weight="700" text-anchor="middle" fill="#14213d">Payment gateway</text><text x="215" y="225" font-size="20" text-anchor="middle" fill="#334155">Checkout connection</text><text x="215" y="260" font-size="20" text-anchor="middle" fill="#334155">Secure data capture</text><text x="215" y="295" font-size="20" text-anchor="middle" fill="#334155">Payment data transmission</text>
<rect x="440" y="120" width="320" height="245" rx="20" fill="#e9f7f2" stroke="#3b8b73" stroke-width="3"/><text x="600" y="175" font-size="27" font-weight="700" text-anchor="middle" fill="#14213d">Payment processor</text><text x="600" y="225" font-size="20" text-anchor="middle" fill="#334155">Transaction routing</text><text x="600" y="260" font-size="20" text-anchor="middle" fill="#334155">Authorization messages</text><text x="600" y="295" font-size="20" text-anchor="middle" fill="#334155">Processing support</text>
<rect x="825" y="120" width="320" height="245" rx="20" fill="#fff4e5" stroke="#c28a39" stroke-width="3"/><text x="985" y="175" font-size="27" font-weight="700" text-anchor="middle" fill="#14213d">Payment service provider</text><text x="985" y="225" font-size="20" text-anchor="middle" fill="#334155">May bundle gateway</text><text x="985" y="260" font-size="20" text-anchor="middle" fill="#334155">Processing and acquiring</text><text x="985" y="295" font-size="20" text-anchor="middle" fill="#334155">Plus other payment tools</text>
<text x="600" y="415" font-size="17" text-anchor="middle" fill="#64748b">Actual services and responsibilities vary by provider and contract.</text>
</g></svg>