<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Payment reconciliation flow</title><desc id="desc">Customer orders and captures flow into processor reports, then into a clearing account and the bank deposit, with matching checks between each stage.</desc>
<rect width="1200" height="500" rx="24" fill="#F5F7FA"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#14213D">Follow the money across four records</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="45" y="150" width="235" height="190" rx="18" fill="#fff" stroke="#D8DFEA" stroke-width="3"/><circle cx="162" cy="195" r="24" fill="#E7EDFF"/><text x="162" y="204" font-size="25" font-weight="700" fill="#2457F5">1</text><text x="162" y="250" font-size="23" font-weight="700" fill="#14213D">Orders &amp; sales</text><text x="162" y="284" font-size="17" fill="#586174">What customers</text><text x="162" y="309" font-size="17" fill="#586174">were charged</text>
<rect x="340" y="150" width="235" height="190" rx="18" fill="#fff" stroke="#D8DFEA" stroke-width="3"/><circle cx="457" cy="195" r="24" fill="#E7EDFF"/><text x="457" y="204" font-size="25" font-weight="700" fill="#2457F5">2</text><text x="457" y="250" font-size="23" font-weight="700" fill="#14213D">Processor report</text><text x="457" y="284" font-size="17" fill="#586174">Captures, refunds,</text><text x="457" y="309" font-size="17" fill="#586174">fees &amp; disputes</text>
<rect x="635" y="150" width="235" height="190" rx="18" fill="#fff" stroke="#D8DFEA" stroke-width="3"/><circle cx="752" cy="195" r="24" fill="#E7EDFF"/><text x="752" y="204" font-size="25" font-weight="700" fill="#2457F5">3</text><text x="752" y="250" font-size="23" font-weight="700" fill="#14213D">Clearing account</text><text x="752" y="284" font-size="17" fill="#586174">Records net amount</text><text x="752" y="309" font-size="17" fill="#586174">due from provider</text>
<rect x="930" y="150" width="225" height="190" rx="18" fill="#fff" stroke="#D8DFEA" stroke-width="3"/><circle cx="1042" cy="195" r="24" fill="#E7EDFF"/><text x="1042" y="204" font-size="25" font-weight="700" fill="#2457F5">4</text><text x="1042" y="250" font-size="23" font-weight="700" fill="#14213D">Bank deposit</text><text x="1042" y="284" font-size="17" fill="#586174">Confirms cash</text><text x="1042" y="309" font-size="17" fill="#586174">actually received</text>
</g>
<g fill="none" stroke="#2457F5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M285 245h45m-12-12 12 12-12 12"/><path d="M580 245h45m-12-12 12 12-12 12"/><path d="M875 245h45m-12-12 12 12-12 12"/></g>
<text x="600" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#586174">Match by transaction ID, payout reference, currency and settlement date.</text>
</svg>